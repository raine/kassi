[[check]]
name = "format-check"
mode = "rustfmt"
command = ["cargo", "fmt", "--all", "--", "--check"]

[[check]]
name = "clippy"
mode = "cargo"
command = ["cargo", "clippy", "--message-format=json", "--target-dir", "target/clippy", "--all-targets", "--", "-D", "warnings", "-D", "clippy::all"]

[[check]]
name = "test"
mode = "nextest"
command = ["cargo", "nextest", "run", "--target-dir", "target/test", "--all-targets", "--locked", "--no-fail-fast", "--status-level", "fail"]

[[group]]
name = "all"
checks = ["format-check", "clippy", "test", "cargo-machete"]

[[group]]
name = "fast-readonly"
checks = ["format-check", "cargo-machete"]

[[group]]
name = "tests"
checks = ["test"]
