name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: kassi

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: kassi-darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: kassi-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: kassi-linux-amd64
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: kassi-linux-arm64
            zigbuild: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
      # Static musl binaries, linked by zig as in `just build-pi`.
      - uses: mlugg/setup-zig@v2
        if: matrix.zigbuild
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: matrix.zigbuild
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          if [ "${{ matrix.zigbuild }}" == "true" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          # Without --no-mac-metadata, bsdtar adds AppleDouble ._kassi entries.
          if [ "$RUNNER_OS" == macOS ]; then
            tar --no-mac-metadata -C "$bin_dir" -czf "${{ matrix.artifact }}.tar.gz" "$BIN_NAME"
          else
            tar -C "$bin_dir" -czf "${{ matrix.artifact }}.tar.gz" "$BIN_NAME"
          fi
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Smoke test packaged binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          package_dir="package-${{ matrix.artifact }}"
          mkdir "$package_dir"
          shasum -a 256 -c "${{ matrix.artifact }}.sha256"
          tar -xzf "${{ matrix.artifact }}.tar.gz" -C "$package_dir"
          "$package_dir/${BIN_NAME}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    needs: build
    # Hyphenated tags such as v1.2.3-test.1 build without publishing.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kassi-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
